#spring.jpa.show-sql=true

# SHOW SQL
spring.jpa.properties.hibernate.show_sql=true

# FORMAT SQL
spring.jpa.properties.hibernate.format_sql=true

#SHOW BIND VALUES
# Prior to Hibernate 6.x
logging.level.org.hibernate.type.descriptor.sql=trace

# SHOW BIND VALUES
# New with Hibernate 6.x
logging.level.org.hibernate.orm.jdbc.bind=trace

# SHOW THE SQL EXTRACTED VALUES
logging.level.org.hibernate.orm.jdbc.extract=trace

# SHOW THE TRANSACTION BOUNDARIES
# HIBERNATE TRANSACTION
logging.level.org.hibernate.engine.transaction=trace
# SPRING TRANSACTION
logging.level.org.springframework.test.context.transaction=debug

# SQL SYNTAX HIGHLIGHTING
spring.jpa.properties.hibernate.highlight_sql=true

# ENABLE H2 Console
spring.h2.console.enabled=true

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MYSQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.username=sa
spring.datasource.password=sa
spring.jpa.database=mysql

# I THINK NECESSARY for H2
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate

# NOT NECESSARY DEFAULT VALUE
# spring.jpa.defer-datasource-initialization=false

# POSSIBLE BUT NOT NECESSARY IN OUR CONTEXT
# spring.datasource.driver-class-name=org.h2.Driver

# New to SB3.4.0! Structured logging
# possible values logstash, ecs, gelf
# logging.structured.format.console=gelf